name: sigma-validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pySigma
        run: python -m pip install -r requirements-ci.txt
      - name: Validate rules and run the self-test (broken rules must be rejected)
        run: python tools/validate_rules.py
      - name: Test the validator (pytest)
        run: python -m pytest -q tests
